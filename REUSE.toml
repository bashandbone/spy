version = 1
SPDX-PackageName = "spy"
SPDX-PackageSupplier = "Adam Poulemanos"
SPDX-PackageDownloadLocation = "https://github.com/bashandbone/spy"

[[annotations]]
path = [
  ".github/prompts/speckit.*.md",
  ".github/agents/speckit.*.agent.md",
  ".claude/commands/speckit.*.md",
  ".gemini/commands/speckit.*.toml",
  ".specify/scripts/**",
  ".specify/templates/**",
  ".specify/workflows/**",
  ".specify/extensions/**",
  ".specify/integrations/**",
  ".claude/skills/**",
]
precedence = "override"
SPDX-FileCopyrightText = "GitHub Inc."
SPDX-License-Identifier = "MIT"

# speckit-generated metadata that has no native comment syntax. Owned by
# the project author; tracked here rather than inline.
[[annotations]]
path = [
  ".specify/feature.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Poulemanos"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Graphics encoder golden testdata + the deterministic input PNG.
# Binary fixtures with no native comment syntax — tracked here.
[[annotations]]
path = [
  "internal/graphics/testdata/*.bin",
  "internal/graphics/testdata/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Poulemanos"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# PDF test fixtures. Both files are generated locally by a small Go
# program that emits a deterministic minimal-valid PDF carrying the
# sentinel string "Dummy PDF file" — multi-page.pdf is the same
# document merged 3× via pdfcpu's API. No third-party provenance.
[[annotations]]
path = [
  "tests/e2e/fixtures/dummy.pdf",
  "tests/e2e/fixtures/multi-page.pdf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Adam Poulemanos"
SPDX-License-Identifier = "MIT OR Apache-2.0"


