<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spy demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>spy</h1>
      <nav>
        <a href="/docs">Docs</a>
        <a href="/install">Install</a>
      </nav>
    </header>
    <main>
      <article id="hero">
        <p>A keyboard-driven popup reader for the terminal.</p>
        <button type="button" data-action="open">Open file</button>
      </article>
      <section class="features">
        <h2>Features</h2>
        <ul>
          <li>Syntax highlighting</li>
          <li>Theme detection</li>
          <li>PDF and image support</li>
        </ul>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
